apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-microservice-java
  labels:
    app: time-microservice-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: time-microservice-java
  template:
    metadata:
      labels:
        app: time-microservice-java
    spec:
      containers:
        - name: time-microservice-java
          image: time-microservice-java:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: TZ
              value: "UTC"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: time-microservice-java
  labels:
    app: time-microservice-java
spec:
  selector:
    app: time-microservice-java
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP